plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.whatawonderfulworld.goodnewsallen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.whatawonderfulworld.goodnewsallen'
        // AndroidX (fragment 1.8 / core 1.15) requires API 21+ (旧: minSdk 11)
        minSdk 21
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Align transitive kotlin-stdlib(-jdk7/-jdk8) versions pulled in by AndroidX
    implementation platform(libs.kotlin.bom)
    implementation libs.androidx.core
    implementation libs.androidx.fragment
    implementation libs.androidx.viewpager
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
